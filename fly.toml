app = 'bot2-auto-trader-jrdro'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PYTHONUNBUFFERED = '1'
  MODE = 'AGRESIVO'
  SIGNAL_SOURCE = 'telegram'
  LOOP_SEC = '10'
  PAPER_FEE = '0.001'
  PAPER_SLIPPAGE_BPS = '2'
  SQLITE_FILE = '/data/bot_state.sqlite3'

[mounts]
  source = 'bot2_data'
  destination = '/data'

[processes]
  app = 'python -u bot2_auto_trader.py'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
